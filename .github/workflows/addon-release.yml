# Releases the addon, by hand only: Actions > Addon release > Run workflow. Leave the version empty to release the
# version the addon already has (read from its .toc), or type a higher one to change to it first.
#
# The version is a whole number (1, 2, 3 ...): the addon and the module check each other's number at login, so it
# is written to every place that holds it, committed to the branch you run it on, and then released:
#   - the addon's .toc ("## Version: N")
#   - the addon's Lua (ADDON_VERSION)
#   - the module's C++ (the number the server expects; rebuild the server to use it)
# The release is tagged vN and has <Addon>.zip, the addon folder ready to unzip into Interface\AddOns.
name: Addon release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version: leave empty to release the current one (from the .toc), or type a higher whole number to change to it first"
        required: false
        default: ""
        type: string
      notes:
        description: "Release notes (optional; the install steps are added below them)"
        required: false
        type: string

permissions:
  contents: write

env:
  ADDON_DIR: addon/DynamicScaling
  ADDON_NAME: DynamicScaling
  LUA_FILE: addon/DynamicScaling/DynamicScaling.lua
  CPP_FILE: src/DynamicScalingAddon.cpp
  CPP_NAME: DS_ADDON_VERSION

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          current=$(sed -n 's/^## Version:[[:space:]]*//p' "$ADDON_DIR/$ADDON_NAME.toc" | tr -d '\r' | head -n1)
          VERSION=$(echo "$INPUT_VERSION" | tr -d '[:space:]')
          VERSION=${VERSION:-$current}
          echo "Current version (in $ADDON_NAME.toc): $current. Releasing: $VERSION."
          {
            echo "### $ADDON_NAME"
            echo "- Current version in the .toc: **$current**"
            echo "- Releasing: **v$VERSION**"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if ! echo "$VERSION" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::error::The version must be a whole number like 5 (no v, no dots), got '$VERSION'."
            exit 1
          fi
          if gh release view "v$VERSION" > /dev/null 2>&1 || git ls-remote --exit-code --tags origin "v$VERSION" > /dev/null 2>&1; then
            echo "::error::v$VERSION is already released or tagged. Pick a higher version."
            exit 1
          fi

      - name: Write the version to the .toc, the Lua and the module
        run: |
          set -e
          toc="$ADDON_DIR/$ADDON_NAME.toc"
          sed -i -E "s/^## Version:.*/## Version: $VERSION/" "$toc"
          sed -i -E "s/^local ADDON_VERSION = [0-9]+/local ADDON_VERSION = $VERSION/" "$LUA_FILE"
          sed -i -E "s/(constexpr uint32 $CPP_NAME = )[0-9]+;/\1$VERSION;/" "$CPP_FILE"
          grep -q "^## Version: $VERSION\$" "$toc" || { echo "::error::Could not set the version in $toc"; exit 1; }
          grep -q "^local ADDON_VERSION = $VERSION\b" "$LUA_FILE" || { echo "::error::Could not set ADDON_VERSION in $LUA_FILE"; exit 1; }
          grep -q "constexpr uint32 $CPP_NAME = $VERSION;" "$CPP_FILE" || { echo "::error::Could not set $CPP_NAME in $CPP_FILE"; exit 1; }
          git diff --stat

      - name: Commit and push the new version
        run: |
          set -e
          if git diff --quiet; then
            echo "The files already say version $VERSION, nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
            git commit -am "$ADDON_NAME addon version $VERSION"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Package and release
        env:
          NOTES: ${{ inputs.notes }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          zip="$ADDON_NAME.zip"
          (cd "$(dirname "$ADDON_DIR")" && zip -qr "$GITHUB_WORKSPACE/$zip" "$(basename "$ADDON_DIR")")
          body="${NOTES:+$NOTES

          }**Install:** unzip \`$zip\` into your WoW 3.3.5 client's \`Interface\\AddOns\` folder (you get
          \`Interface\\AddOns\\$ADDON_NAME\`), then restart the game or type /reload.

          **Server:** this addon expects version $VERSION of the module (\`$CPP_NAME\`). Update and rebuild the
          module to the commit of this release; players with another version are told in chat."
          gh release create "v$VERSION" "$zip" --target "$(git rev-parse HEAD)" --title "$ADDON_NAME v$VERSION" \
            --notes "$body"
