# Releases the addon, by hand only: Actions > Addon release > Run workflow. Leave the version empty to release the
# version the addon already has (read from its .toc), or type a higher one to change to it first.
#
# The version is a whole number (1, 2, 3 ...): the addon and the module check each other's number at login, so it
# is written to every place that holds it, committed to the branch you run it on, and then released:
#   - the addon's .toc ("## Version: N")
#   - the addon's Lua (ADDON_VERSION)
#   - the module's C++ (the number the server expects; rebuild the server to use it)
# The release is tagged vN and has <Addon>.zip, the addon folder ready to unzip into Interface\AddOns.
# A run with no addon changes since the last release releases nothing.
#
# Showing the current version in the Run workflow form and in the run's title: GitHub can't read it from the .toc
# there, so this file holds it as text (run-name and the version description). GitHub's own token may not change
# workflow files, so to keep that text in step after a version change, add a secret named RELEASE_TOKEN (Settings >
# Secrets and variables > Actions): a fine-grained personal access token for this repository with Contents and
# Workflows set to Read and write. Without it everything else works; only that text stays at the old number.
name: Addon release
# The run's title. The fallback number is the current version: the workflow keeps it (and the "current" in the
# version box below) up to date when it has a RELEASE_TOKEN secret, see the end of this file's comments.
run-name: "Addon Release Version: ${{ inputs.version || '3' }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (current: 3). Leave empty to release v3, or type a higher whole number to change to it first"
        required: false
        default: ""
        type: string
      notes:
        description: "Release notes (optional; the install steps are added below them)"
        required: false
        type: string

permissions:
  contents: write

env:
  ADDON_DIR: addon/DynamicScaling
  ADDON_NAME: DynamicScaling
  LUA_FILE: addon/DynamicScaling/DynamicScaling.lua
  CPP_FILE: src/DynamicScalingAddon.cpp
  CPP_NAME: DS_ADDON_VERSION

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
          fetch-depth: 0   # every commit and tag, to compare the addon with the last release

      - name: Check the version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          current=$(sed -n 's/^## Version:[[:space:]]*//p' "$ADDON_DIR/$ADDON_NAME.toc" | tr -d '\r' | head -n1)
          VERSION=$(echo "$INPUT_VERSION" | tr -d '[:space:]')
          VERSION=${VERSION:-$current}
          echo "Current version (in $ADDON_NAME.toc): $current. Releasing: $VERSION."
          {
            echo "### $ADDON_NAME"
            echo "- Current version in the .toc: **$current**"
            echo "- Releasing: **v$VERSION**"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          if ! echo "$VERSION" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::error::The version must be a whole number like 5 (no v, no dots), got '$VERSION'."
            exit 1
          fi
          # Nothing new in the addon since the last release: nothing to release (not an error)
          last=$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n1)
          if [ -n "$last" ] && git diff --quiet "$last" HEAD -- "$ADDON_DIR"; then
            echo "::notice::The addon hasn't changed since $last, so there is nothing to release."
            echo "- **Skipped:** the addon hasn't changed since $last." >> "$GITHUB_STEP_SUMMARY"
            echo "SKIP=1" >> "$GITHUB_ENV"
            exit 0
          fi
          [ -n "$last" ] && echo "- Addon changes since $last: $(git diff --shortstat "$last" HEAD -- "$ADDON_DIR")" \
            >> "$GITHUB_STEP_SUMMARY"
          if gh release view "v$VERSION" > /dev/null 2>&1 || git ls-remote --exit-code --tags origin "v$VERSION" > /dev/null 2>&1; then
            echo "::error::v$VERSION is already released, but the addon changed since $last. Type a higher version."
            exit 1
          fi

      - name: Write the version to the .toc, the Lua and the module
        if: env.SKIP != '1'
        run: |
          set -e
          toc="$ADDON_DIR/$ADDON_NAME.toc"
          sed -i -E "s/^## Version:.*/## Version: $VERSION/" "$toc"
          sed -i -E "s/^local ADDON_VERSION = [0-9]+/local ADDON_VERSION = $VERSION/" "$LUA_FILE"
          sed -i -E "s/(constexpr uint32 $CPP_NAME = )[0-9]+;/\1$VERSION;/" "$CPP_FILE"
          grep -q "^## Version: $VERSION\$" "$toc" || { echo "::error::Could not set the version in $toc"; exit 1; }
          grep -q "^local ADDON_VERSION = $VERSION\b" "$LUA_FILE" || { echo "::error::Could not set ADDON_VERSION in $LUA_FILE"; exit 1; }
          grep -q "constexpr uint32 $CPP_NAME = $VERSION;" "$CPP_FILE" || { echo "::error::Could not set $CPP_NAME in $CPP_FILE"; exit 1; }
          git diff --stat

      - name: Show the new version in this workflow's form and run title (needs RELEASE_TOKEN)
        if: env.SKIP != '1'
        env:
          HAS_TOKEN: ${{ secrets.RELEASE_TOKEN != '' }}
        run: |
          set -e
          wf=.github/workflows/addon-release.yml
          if [ "$HAS_TOKEN" = "true" ]; then
            sed -i -E "s/(inputs\.version \|\| ')[0-9]+(' \}\})/\1$VERSION\2/" "$wf"
            sed -i -E "s/Version \(current: [0-9]+\)\. Leave empty to release v[0-9]+,/Version (current: $VERSION). Leave empty to release v$VERSION,/" "$wf"
          elif ! grep -q "(current: $VERSION)" "$wf"; then
            echo "::warning::The Run workflow form still says the old current version: add a RELEASE_TOKEN secret to keep it up to date (see the comments at the top of $wf)."
          fi

      - name: Commit and push the new version
        if: env.SKIP != '1'
        run: |
          set -e
          if git diff --quiet; then
            echo "The files already say version $VERSION, nothing to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
            git commit -am "$ADDON_NAME addon version $VERSION"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Package and release
        if: env.SKIP != '1'
        env:
          NOTES: ${{ inputs.notes }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          zip="$ADDON_NAME.zip"
          (cd "$(dirname "$ADDON_DIR")" && zip -qr "$GITHUB_WORKSPACE/$zip" "$(basename "$ADDON_DIR")")
          body="${NOTES:+$NOTES

          }**Install:** unzip \`$zip\` into your WoW 3.3.5 client's \`Interface\\AddOns\` folder (you get
          \`Interface\\AddOns\\$ADDON_NAME\`), then restart the game or type /reload.

          **Server:** this addon expects version $VERSION of the module (\`$CPP_NAME\`). Update and rebuild the
          module to the commit of this release; players with another version are told in chat."
          gh release create "v$VERSION" "$zip" --target "$(git rev-parse HEAD)" --title "$ADDON_NAME v$VERSION" \
            --notes "$body"
